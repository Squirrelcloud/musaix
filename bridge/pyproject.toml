[project]
name = "alic3x-bridge"
version = "0.1.0"
description = "Local OSC bridge between the Alic3X tool brain and Ableton Live 12 (via AbletonOSC)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-osc>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alic3x-bridge = "alic3x_bridge.__main__:main"

[tool.setuptools]
packages = ["alic3x_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
