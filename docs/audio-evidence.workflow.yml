name: Audio evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analysis/requirements-dev.lock
      - run: python -m pytest services/analysis/tests -q
  database-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/audio-rls.test.mjs
